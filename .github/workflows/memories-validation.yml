name: Memories validation

on:
  push:
    branches:
      - ios/ios-app-foundation
    paths:
      - 'platform/**'
      - '.github/workflows/**'
  pull_request:
    branches:
      - ios/ios-app-foundation
    paths:
      - 'platform/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
        working-directory: platform
      - name: Run production build
        run: npm run build
        working-directory: platform
