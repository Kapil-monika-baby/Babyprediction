name: Baby Prediction Build

on:
  pull_request:
    paths:
      - 'platform/**'
      - 'package.json'
      - '.github/workflows/platform-build.yml'
  push:
    branches:
      - platform-foundation
  workflow_dispatch:

jobs:
  lockfiles:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate reproducible lockfiles without running package scripts
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit
          npm install --package-lock-only --ignore-scripts --no-audit --prefix platform
      - name: Report exact npm advisories
        shell: bash
        run: |
          set +e
          npm audit --json > /tmp/root-audit.json
          npm audit --json --prefix platform > /tmp/platform-audit.json
          set -e
          node - <<'NODE'
          const fs = require('fs');
          for (const [label, file] of [['root', '/tmp/root-audit.json'], ['platform', '/tmp/platform-audit.json']]) {
            const report = JSON.parse(fs.readFileSync(file, 'utf8'));
            console.log(JSON.stringify({
              project: label,
              totals: report.metadata?.vulnerabilities ?? {},
              advisories: Object.entries(report.vulnerabilities ?? {}).map(([name, item]) => ({
                name,
                severity: item.severity,
                direct: item.isDirect,
                range: item.range,
                fixAvailable: item.fixAvailable,
                via: item.via.map(v => typeof v === 'string' ? v : {
                  title: v.title, url: v.url, range: v.range, severity: v.severity
                })
              }))
            }, null, 2));
          }
          NODE
      - name: Commit generated lockfiles to the PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json platform/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfiles already current; no commit needed."
          else
            git commit -m "chore: add reproducible npm lockfiles"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

  build:
    if: always() && (needs.lockfiles.result == 'success' || needs.lockfiles.result == 'skipped')
    runs-on: ubuntu-latest
    needs: [lockfiles]
    defaults:
      run:
        working-directory: platform
    env:
      # Build-only placeholders; never use these for deployed environments.
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-build-placeholder-key
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - run: deno test supabase/functions/delete-account/account-deletion-utils.test.ts
      - run: npm ci
      - run: deno check --node-modules-dir=auto supabase/functions/delete-account/index.ts
      - run: npm run build
