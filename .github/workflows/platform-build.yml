name: Baby Prediction Build

on:
  pull_request:
    paths:
      - 'platform/**'
      - '.github/workflows/platform-build.yml'
  push:
    branches:
      - platform-foundation
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    env:
      # Build-only placeholders; never use these for deployed environments.
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-build-placeholder-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: platform/package.json
      - run: npm install
      - run: npm run build
