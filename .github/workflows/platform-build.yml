name: Baby Prediction Build

on:
  pull_request:
    paths:
      - 'platform/**'
      - '.github/workflows/platform-build.yml'
  push:
    branches:
      - platform-foundation
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    env:
      # Build-only placeholders; never use these for deployed environments.
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-build-placeholder-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: platform/package.json
      - run: npm install
      - name: Type-check the Next.js application
        run: npx tsc --noEmit
      - name: Set up Deno for Supabase Edge Functions
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Supabase Edge Functions
        run: >-
          deno check --node-modules-dir=auto
          supabase/functions/delete-account/index.ts
          supabase/functions/create-memory-invitation/index.ts
          supabase/functions/accept-memory-invitation/index.ts
          supabase/functions/create-memory-share/index.ts
          supabase/functions/resolve-memory-share/index.ts
          supabase/functions/revoke-memory-share/index.ts
      - run: npm run build
